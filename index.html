
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VYRA - Filipino Legends Arena</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07111f;color:white;font-family:Arial,sans-serif;overflow:hidden}
button,input,select{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 16px;background:#16a6c9;color:white;font-weight:bold}
button:hover{filter:brightness(1.2)}
#lobby{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at center,#173f62,#07111f 70%);overflow:auto}
.panel{width:min(950px,95vw);max-height:95vh;overflow:auto;padding:25px;background:#101f32;border:1px solid #2c6687;border-radius:18px;box-shadow:0 15px 70px #000}
h1{color:#51d9ff;letter-spacing:5px;text-align:center;font-size:42px;margin:5px}
.sub{text-align:center;color:#a6c5d7;margin-bottom:22px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input,select{width:100%;padding:12px;border-radius:8px;border:1px solid #31536c;background:#071727;color:white}
.heroes{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px;margin:17px 0}
.hero{padding:12px 5px;border:1px solid #34516a;background:#172a40;border-radius:10px;text-align:center;cursor:pointer}
.hero.selected{border:2px solid #48dfff;background:#16465b}
.hero .emoji{font-size:29px}
.hero small{display:block;color:#a9c8d8;margin-top:5px}
#start{width:100%;font-size:18px;padding:15px}
#game{display:none;position:absolute;inset:0}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:10px;right:10px;pointer-events:none;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.hudbox{background:#071827dc;border:1px solid #2d617d;border-radius:10px;padding:10px;font-size:13px;pointer-events:auto}
#health{width:190px;height:12px;background:#452a36;border-radius:8px;overflow:hidden;margin-top:6px}
#healthbar{height:100%;width:100%;background:#27df79}
#notice{position:absolute;top:85px;left:50%;transform:translateX(-50%);background:#061b2ddd;padding:10px 18px;border-radius:10px;color:#b8efff;pointer-events:none}
#shop{position:absolute;right:10px;top:105px;width:175px;background:#091a2bdc;border:1px solid #315d77;border-radius:12px;padding:10px}
#shop h3{margin:2px 0 10px;color:#55dfff}
.item{width:100%;margin:4px 0;text-align:left;font-size:12px;padding:9px}
#controls{position:absolute;bottom:15px;left:15px;right:15px;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
#controls button{pointer-events:auto;box-shadow:0 3px 12px #0009}
#stick{width:120px;height:120px;border-radius:50%;background:#ffffff20;border:2px solid #ffffff55;position:relative;touch-action:none;pointer-events:auto}
#knob{position:absolute;width:48px;height:48px;left:34px;top:34px;background:#9cecffaa;border-radius:50%}
.actions{display:flex;gap:8px;align-items:flex-end}
.action{width:65px;height:65px;border-radius:50%;background:#175b86;border:2px solid #77dfff;padding:5px}
.action.attack{width:78px;height:78px;background:#b34b25}
.action small{display:block;font-size:10px}
#score{position:absolute;top:75px;left:10px;background:#061827cc;padding:8px;border-radius:8px;font-size:12px}
#mapinfo{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:11px;color:#bceeff;pointer-events:none}
@media(max-width:650px){
.panel{padding:14px}.fields{grid-template-columns:1fr 1fr}
#shop{width:135px;top:110px}.item{font-size:10px;padding:7px}
.hudbox{font-size:11px;padding:7px}
#stick{width:100px;height:100px}
#knob{left:26px;top:26px}
.action{width:53px;height:53px}.action.attack{width:65px;height:65px}
}
</style>
</head>
<body>
<div id="lobby">
 <div class="panel">
  <h1>VYRA</h1>
  <div class="sub">FILIPINO LEGENDS ARENA · 5V5 MULTIPLAYER</div>
  <div class="fields">
   <input id="playerName" placeholder="Player name" maxlength="20" value="Player">
   <input id="roomName" placeholder="Room code" maxlength="24" value="VYRA-1">
   <select id="spell">
    <option value="heal">Heal</option>
    <option value="flicker">Flicker</option>
    <option value="sprint">Sprint</option>
    <option value="flameshot">Flameshot</option>
   </select>
  </div>
  <h3>SELECT YOUR HERO</h3>
  <div class="heroes" id="heroes"></div>
  <button id="start">ENTER BATTLE</button>
  <p class="sub" id="status">Choose your hero and join a room.</p>
 </div>
</div>

<div id="game">
 <canvas id="world"></canvas>
 <div id="hud">
  <div class="hudbox">
   <b id="heroLabel">Hero</b>
   <div id="health"><div id="healthbar"></div></div>
   <span id="hpText">HP: --</span>
  </div>
  <div class="hudbox" id="teamLabel">TEAM</div>
  <div class="hudbox">🪙 <b id="gold">1000</b><br>Level <b id="level">1</b></div>
 </div>
 <div id="score">Players: 0 / 10<br>Wave: 0</div>
 <div id="notice">Welcome to VYRA Arena!</div>
 <div id="shop">
  <h3>⚔ ITEM SHOP</h3>
  <button class="item" data-item="blade">Blade · 500 gold</button>
  <button class="item" data-item="armor">Armor · 450 gold</button>
  <button class="item" data-item="boots">Boots · 400 gold</button>
  <button class="item" data-item="crystal">Crystal · 700 gold</button>
  <button class="item" data-item="guardian">Guardian · 900 gold</button>
  <button class="item" data-item="greatsword">Greatsword · 1200 gold</button>
  <small id="inventory">Inventory: empty</small>
 </div>
 <div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div class="actions">
   <button class="action" id="spellBtn">✨<small id="spellName">HEAL</small></button>
   <button class="action" data-skill="1">1<small>SKILL</small></button>
   <button class="action" data-skill="2">2<small>SKILL</small></button>
   <button class="action" data-skill="3">3<small>ULTIMATE</small></button>
   <button class="action attack" id="attack">⚔<small>ATTACK</small></button>
  </div>
 </div>
 <div id="mapinfo">EXP LANE · MID LANE · GOLD LANE | JUNGLE · RIVER</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
const roster=[
["rizal","Jose Rizal","Mage","📜"],["bonifacio","Andres Bonifacio","Fighter","⚔️"],
["lapulapu","Lapulapu","Tank","🛡️"],["gabriela","Gabriela Silang","Fighter","🏹"],
["sora","Sora","Assassin","🌙"],["mabini","Apolinario Mabini","Mage","📖"],
["diego","Diego Silang","Fighter","🗡️"],["kudarat","Sultan Kudarat","Tank","👑"],
["gregoria","Gregoria de Jesus","Support","🌺"],["juanluna","Juan Luna","Mage","🎨"],
["antonio","Antonio Luna","Fighter","⚔️"],["teresa","Teresa Magbanua","Marksman","🏹"],
["jacinto","Emilio Jacinto","Assassin","🔥"],["aguinaldo","Emilio Aguinaldo","Fighter","🎖️"],
["urdaneta","Urdaneta","Mage","🌊"],["quezon","Manuel Quezon","Tank","🛡️"],
["osmena","Sergio Osmeña","Support","⭐"],["delpilar","Del Pilar","Fighter","⚔️"],
["aguinaldo2","Aguinaldo II","Marksman","🏹"],["luna2","Luna II","Assassin","🌙"],
["urduja","Princess Urduja","Tank","👑"],["lamang","Lam-Ang","Fighter","🐉"],
["makiling","Maria Makiling","Mage","🌸"],["carpio","Bernardo Carpio","Tank","⛰️"],
["sarimanok","Sarimanok","Marksman","🦅"],["bakunawa","Bakunawa","Tank","🐉"],
["kapre","Kapre","Tank","🌳"],["tikbalang","Tikbalang","Assassin","🐎"],
["manananggal","Manananggal","Mage","🦇"],["diwata","Diwata","Support","🧚"]
];

let selected=roster[0],socket=null,myId=null,myTeam=null,players=[],minions=[],towers=[],boss=null;
let gold=1000,level=1,inventory=[],spell="heal",gameStarted=false;
const $=id=>document.getElementById(id);
const heroGrid=$("heroes");

roster.forEach((h,i)=>{
 const el=document.createElement("div");
 el.className="hero"+(i===0?" selected":"");
 el.innerHTML=`<div class="emoji">${h[3]}</div><b>${h[1]}</b><small>${h[2]}</small>`;
 el.onclick=()=>{
  selected=h;
  document.querySelectorAll(".hero").forEach(x=>x.classList.remove("selected"));
  el.classList.add("selected");
 };
 heroGrid.appendChild(el);
});

function notify(msg){
 $("notice").textContent=msg;
}
function send(data){
 if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(data));
}

$("start").onclick=()=>{
 spell=$("spell").value;
 $("status").textContent="Connecting to VYRA server...";
 socket=new WebSocket("wss://moba-1-u3rn.onrender.com");

 socket.onopen=()=>{
  send({
   type:"join",
   name:$("playerName").value||"Player",
   room:$("roomName").value||"VYRA-1",
   hero:selected[0],
   heroName:selected[1],
   heroRole:selected[2],
   spell
  });
 };

 socket.onmessage=e=>{
  const d=JSON.parse(e.data);
  if(d.type==="joined"){
   myId=d.id;myTeam=d.team;
   $("lobby").style.display="none";
   $("game").style.display="block";
   $("heroLabel").textContent=selected[1];
   $("teamLabel").textContent=myTeam.toUpperCase()+" TEAM";
   $("spellName").textContent=spell.toUpperCase();
   gameStarted=true;
   initializeWorld();
   notify("Joined battle! Destroy enemy towers!");
  }
  if(d.type==="state"){
   players=d.players||[];
   minions=d.minions||[];
   towers=d.towers||[];
   boss=d.boss||null;
   const me=players.find(p=>p.id===myId);
   if(me){
    gold=me.gold;level=me.level;
    $("gold").textContent=gold;
    $("level").textContent=level;
    $("hpText").textContent=`HP: ${Math.ceil(me.hp)} / ${me.maxHp}`;
    $("healthbar").style.width=Math.max(0,me.hp/me.maxHp*100)+"%";
    $("inventory").textContent="Inventory: "+(me.items.join(", ")||"empty");
   }
   $("score").innerHTML=`Players: ${players.length}/10<br>Wave: ${d.wave||0}<br>Minions: ${minions.length}<br>Towers: ${towers.filter(t=>t.alive).length}`;
  }
  if(d.type==="notice")notify(d.message);
  if(d.type==="error")notify(d.message);
 };
 socket.onerror=()=>{$("status").textContent="Connection error. Check your Render server.";};
 socket.onclose=()=>{if(gameStarted)notify("Disconnected from server.");};
};

document.querySelectorAll("[data-item]").forEach(btn=>{
 btn.onclick=()=>send({type:"buy",id:btn.dataset.item});
});
document.querySelectorAll("[data-skill]").forEach(btn=>{
 btn.onclick=()=>send({type:"skill",skill:Number(btn.dataset.skill)});
});
$("attack").onclick=attackNearest;
$("spellBtn").onclick=()=>{
 const me=players.find(p=>p.id===myId);
 if(!me)return;
 send({type:"spell",spell,x:me.x+9,z:me.z});
 notify(spell.toUpperCase()+" activated!");
};

function attackNearest(){
 const me=players.find(p=>p.id===myId);
 if(!me)return;
 let targets=[
  ...players.filter(p=>p.team!==myTeam&&p.alive),
  ...minions.filter(m=>m.team!==myTeam&&m.alive),
  ...towers.filter(t=>t.team!==myTeam&&t.alive)
 ];
 if(boss&&boss.alive)targets.push(boss);
 targets.sort((a,b)=>Math.hypot(a.x-me.x,a.z-me.z)-Math.hypot(b.x-me.x,b.z-me.z));
 if(targets[0])send({type:"attack",target:targets[0].id});
}

let renderer,scene,camera,ground,objects=new Map();
function initializeWorld(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x7fc4d7);
 scene.fog=new THREE.Fog(0x7fc4d7,80,150);
 camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);
 renderer=new THREE.WebGLRenderer({canvas:$("world"),antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 scene.add(new THREE.HemisphereLight(0xc7eeff,0x32402b,1.5));
 const sun=new THREE.DirectionalLight(0xffffff,1.5);
 sun.position.set(-30,60,30);scene.add(sun);

 ground=new THREE.Mesh(
  new THREE.PlaneGeometry(110,80),
  new THREE.MeshStandardMaterial({color:0x34734c})
 );
 ground.rotation.x=-Math.PI/2;ground.position.y=-.2;scene.add(ground);

 // Three lanes
 [-24,0,24].forEach((z,i)=>{
  const road=new THREE.Mesh(
   new THREE.BoxGeometry(95,.15,8),
   new THREE.MeshStandardMaterial({color:i===1?0x9a967d:0x777b75})
  );
  road.position.set(0,.02,z);scene.add(road);
 });

 // River
 const river=new THREE.Mesh(
  new THREE.BoxGeometry(12,.12,80),
  new THREE.MeshStandardMaterial({color:0x218ebd,roughness:.3})
 );
 river.position.set(0,.05,0);scene.add(river);

 // Jungle decorations
 for(let i=0;i<75;i++){
  const x=(Math.random()-.5)*85;
  const z=(Math.random()-.5)*65;
  if(Math.abs(z)<5||Math.abs(z-24)<5||Math.abs(z+24)<5||Math.abs(x)<7)continue;
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,2.5,7),new THREE.MeshStandardMaterial({color:0x60432a}));
  trunk.position.set(x,1,z);scene.add(trunk);
  const leaves=new THREE.Mesh(new THREE.SphereGeometry(1.7,8,7),new THREE.MeshStandardMaterial({color:0x145b39}));
  leaves.position.set(x,3,z);scene.add(leaves);
 }

 // Bases
 createBuilding(-43,0,0x227dff,5,5,0x1855a4);
 createBuilding(43,0,0xff4848,5,5,0x982828);
 animate();
}

function createBuilding(x,z,color,sx,sz,roofColor){
 const base=new THREE.Mesh(new THREE.BoxGeometry(sx,3,sz),new THREE.MeshStandardMaterial({color}));
 base.position.set(x,1.5,z);scene.add(base);
 const roof=new THREE.Mesh(new THREE.ConeGeometry(3,3,4),new THREE.MeshStandardMaterial({color:roofColor}));
 roof.position.set(x,4.5,z);roof.rotation.y=Math.PI/4;scene.add(roof);
}

function makeCharacter(p){
 const group=new THREE.Group();
 const teamColor=p.team==="blue"?0x2a9fff:0xff4545;
 const body=new THREE.Mesh(new THREE.CylinderGeometry(.65,.85,1.5,8),new THREE.MeshStandardMaterial({color:teamColor}));
 body.position.y=1.2;group.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.48,12,10),new THREE.MeshStandardMaterial({color:0xe4b28c}));
 head.position.y=2.25;group.add(head);
 const cape=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.3,.15),new THREE.MeshStandardMaterial({color:0x27354b}));
 cape.position.set(0,1.3,-.5);group.add(cape);
 return group;
}
function makeUnit(color,radius,height){
 const g=new THREE.Group();
 const mesh=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,height,8),new THREE.MeshStandardMaterial({color}));
 mesh.position.y=height/2;g.add(mesh);
 const head=new THREE.Mesh(new THREE.SphereGeometry(radius*.65,8,8),new THREE.MeshStandardMaterial({color:0xffd29e}));
 head.position.y=height+radius*.5;g.add(head);
 return g;
}
function syncObject(id,create,x,z,color,type){
 let o=objects.get(id);
 if(!o){o=create();scene.add(o);objects.set(id,o);}
 o.position.set(x,0,z);
 return o;
}
function updateWorld(){
 if(!scene)return;
 const liveIds=new Set();

 players.forEach(p=>{
  liveIds.add(p.id);
  let o=syncObject(p.id,()=>makeCharacter(p),p.x,p.z);
  o.visible=p.alive;
  o.position.set(p.x,0,p.z);
  o.rotation.y=p.team==="blue"?Math.PI/2:-Math.PI/2;
 });
 minions.forEach(m=>{
  liveIds.add(m.id);
  let o=syncObject(m.id,()=>makeUnit(m.team==="blue"?0x55aaff:0xff7777,.38,1),m.x,m.z);
  o.visible=m.alive;
 });
 towers.forEach(t=>{
  liveIds.add(t.id);
  let o=syncObject(t.id,()=>makeUnit(t.team==="blue"?0x328aff:0xff5555,1.1,4),t.x,t.z);
  o.visible=t.alive;
 });
 if(boss){
  liveIds.add(boss.id);
  let o=syncObject(boss.id,()=>makeUnit(0x9b48d4,2,4),boss.x,boss.z);
  o.visible=boss.alive;
 }
 for(const [id,o] of objects){
  if(!liveIds.has(id)){scene.remove(o);objects.delete(id);}
 }
}
let lastMove=0;
const keys={};
window.addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key.toLowerCase()==="j")attackNearest();
 if(["1","2","3"].includes(e.key))send({type:"skill",skill:Number(e.key)});
 if(e.key.toLowerCase()==="4")$("spellBtn").click();
});
window.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

let joy={x:0,z:0};
const stick=$("stick"),knob=$("knob");
stick.addEventListener("pointerdown",e=>{stick.setPointerCapture(e.pointerId);moveJoy(e);});
stick.addEventListener("pointermove",e=>{if(e.buttons)moveJoy(e);});
stick.addEventListener("pointerup",resetJoy);
stick.addEventListener("pointercancel",resetJoy);
function moveJoy(e){
 const r=stick.getBoundingClientRect();
 let x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(x,y),max=35;
 if(len>max){x=x/len*max;y=y/len*max;}
 joy.x=x/max;joy.z=y/max;
 knob.style.transform=`translate(${x}px,${y}px)`;
}
function resetJoy(){joy={x:0,z:0};knob.style.transform="translate(0,0)";}

function animate(){
 requestAnimationFrame(animate);
 if(!scene)return;
 const me=players.find(p=>p.id===myId);
 if(me&&me.alive){
  let dx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
  let dz=joy.z+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  const len=Math.hypot(dx,dz);
  if(len>0){
   dx/=Math.max(1,len);dz/=Math.max(1,len);
   const now=performance.now();
   if(now-lastMove>70){
    send({type:"move",x:me.x+dx*.8,z:me.z+dz*.8});
    lastMove=now;
   }
  }
  camera.position.lerp(new THREE.Vector3(me.x+18,25,me.z+23),.08);
  camera.lookAt(me.x,0,me.z);
 }
 updateWorld();
 renderer.render(scene,camera);
}
window.addEventListener("resize",()=>{
 if(!renderer||!camera)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
